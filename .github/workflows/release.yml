name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# This file is kept identical to Key54's apart from the APP / CASK lines and
# Key54's pngquant step, so `diff` between the two shows only what really
# differs. Change both together.

jobs:
  build:
    # The apps target macOS 26 (Info.plist's LSMinimumSystemVersion, read by
    # build.sh), so they need at least the macOS 26 SDK — Key54's Liquid Glass
    # and Pullcord's FoundationModels live there. build.sh pins arm64, so the
    # runner's own architecture doesn't matter.
    runs-on: macos-26
    env:
      APP: Pullcord
      CASK: pullcord
      # These flip on automatically once the corresponding repo secrets exist,
      # so a run without them still builds — it just doesn't sign or publish.
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' }}
      HAS_NOTARY: ${{ secrets.AC_API_KEY_ID != '' && secrets.AC_API_ISSUER_ID != '' && secrets.AC_API_KEY_BASE64 != '' }}
      HAS_TAP: ${{ secrets.TAP_PUSH_TOKEN != '' }}
    steps:
      # A secret that exists but is empty silently switches its whole group off,
      # and the build carries on and produces an ad-hoc-signed app. That is fine
      # for a manual run and disastrous for a tag: both notarize steps skip, the
      # DMG publishes anyway, and every downloader meets "Apple could not verify
      # this app is free of malware". So on a tag it stops here. Byte counts,
      # never values — enough to see which secret is blank.
      - name: Preflight
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEY: ${{ secrets.AC_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          ISSUER: ${{ secrets.AC_API_ISSUER_ID }}
          TAP: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          echo "signing=$HAS_SIGNING  notary=$HAS_NOTARY  tap=$HAS_TAP"
          echo "MACOS_CERT_P12_BASE64 ${#CERT} bytes"
          echo "MACOS_CERT_PASSWORD   ${#CERT_PW} bytes"
          echo "AC_API_KEY_BASE64     ${#KEY} bytes"
          echo "AC_API_KEY_ID         ${#KEY_ID} bytes"
          echo "AC_API_ISSUER_ID      ${#ISSUER} bytes"
          echo "TAP_PUSH_TOKEN        ${#TAP} bytes"
          FAIL=0

          # Shape checks. A wrong-but-present value costs a full build before
          # notarytool rejects it minutes in; these catch it immediately.
          # Only the shapes are ever tested, never echoed.
          if [ "$HAS_NOTARY" = "true" ]; then
            if ! printf '%s' "$ISSUER" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
              echo "::error::AC_API_ISSUER_ID is not a UUID (${#ISSUER} bytes, expected 36). It is the 'Issuer ID' line above the key table in App Store Connect, not the Key ID or Team ID."
              FAIL=1
            fi
            if [ "${#KEY_ID}" -ne 10 ]; then
              echo "::error::AC_API_KEY_ID is ${#KEY_ID} bytes, expected 10 — it is the Key ID column, and also the XXXX in AuthKey_XXXX.p8."
              FAIL=1
            fi
          fi
          if [ "$HAS_TAP" = "true" ]; then
            case "$TAP" in
              github_pat_*|ghp_*) ;;
              *) echo "::error::TAP_PUSH_TOKEN (${#TAP} bytes) does not start with github_pat_ or ghp_ — a fine-grained token is about 93 bytes, a classic one 40."
                 FAIL=1 ;;
            esac
          fi

          # (Notary without signing needs no check of its own: notarytool refuses
          # an ad-hoc signature loudly.)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            if [ "$HAS_SIGNING" != "true" ] || [ "$HAS_NOTARY" != "true" ]; then
              echo "::error::Refusing to publish a tag without signing and notarization secrets — the release would be ad-hoc signed and Gatekeeper would reject it. Check which secret reads 0 bytes above."
              FAIL=1
            fi
          fi
          exit $FAIL

      - uses: actions/checkout@v7

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          # Sign by SHA-1 hash, never by name — several identities can share one
          # name, and the old `grep | head -1` took the first, which may be the
          # older cert Apple is retiring. Exported below as an explicit
          # SIGN_IDENTITY, so build.sh fails (not ad-hoc) if it can't use it and
          # then proves the signer's fingerprint. Same hash as
          # DEFAULT_SIGN_IDENTITY in build.sh.
          SIGN_IDENTITY: DEA1A3749B06CF3619F72152EFC35A48E380C4E4
        run: |
          KEYCHAIN="$RUNNER_TEMP/app.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null
          # Fail the release rather than sign with whatever else the .p12 holds.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "$SIGN_IDENTITY"; then
            echo "::error::The imported .p12 has no valid signing identity with hash $SIGN_IDENTITY."
            echo "Re-export that Developer ID Application cert and update MACOS_CERT_P12_BASE64 / MACOS_CERT_PASSWORD."
            echo "Identities that were imported:"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Using identity: $SIGN_IDENTITY"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      # The git tag is the single source of truth for the version: stamp it into
      # Info.plist before building so the app version can never drift from the
      # release (v1.18 → 1.18). Skipped on manual runs, which have no tag.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Stamping app version: $VERSION"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" Info.plist

      - name: Build
        run: bash build.sh

      # Notarize the .app and staple the ticket into the bundle. This runs
      # before the DMG is built so the image contains an already-stapled app —
      # that is what lets a copy dragged out of it launch cleanly offline.
      - name: Notarize & staple app
        if: env.HAS_NOTARY == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: |
          echo "$AC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/key.p8"
          # ditto, not zip: it preserves the bundle's symlinks and metadata.
          ditto -c -k --keepParent "build/$APP.app" "$RUNNER_TEMP/submit.zip"
          xcrun notarytool submit "$RUNNER_TEMP/submit.zip" \
            --key "$RUNNER_TEMP/key.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "build/$APP.app"

      # A disk image with an Applications symlink, so opening it gives the
      # drag-across window people expect rather than a loose app in Downloads.
      - name: Package DMG
        run: |
          mkdir -p dist/dmgroot
          cp -R "build/$APP.app" dist/dmgroot/
          ln -s /Applications dist/dmgroot/Applications
          # -fs HFS+ is not cosmetic. Without it hdiutil now defaults to APFS,
          # which lays an 11MB volume under well under 1MB of content and leaves
          # its slack full of data that zlib then faithfully compresses — 44–47%
          # of each app's published DMG was that (Key54 882KB → 496KB, Pullcord
          # 793KB → 420KB on HFS+).
          hdiutil create -volname "$APP" -srcfolder dist/dmgroot \
            -ov -fs "HFS+" -format UDZO "dist/$APP.dmg"
          # Sign the disk image itself, with the app's pinned identity, before it
          # is notarized. Unsigned, it rests on its stapled ticket alone, and a
          # disk-image check (spctl -t open --context context:primary-signature)
          # rejects it with "no usable signature". Hardened runtime means nothing
          # for a disk image, but it keeps every codesign call alike.
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            codesign --force --options runtime --timestamp \
              --sign "$SIGN_IDENTITY" "dist/$APP.dmg"
            codesign --verify --strict --verbose=2 "dist/$APP.dmg"
          fi

      # The DMG needs notarizing too. Stapling the app (above) is what lets a
      # copy dragged out of the image launch offline; stapling the image is what
      # stops Gatekeeper complaining about the image itself.
      - name: Notarize & staple DMG
        if: env.HAS_NOTARY == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: |
          echo "$AC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool submit "dist/$APP.dmg" \
            --key "$RUNNER_TEMP/key.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "dist/$APP.dmg"
          shasum -a 256 "dist/$APP.dmg"

      # Gatekeeper's verdict, not just codesign's: before anything is published,
      # the app and the DMG must both carry a valid stapled ticket and assess as
      # "Notarized Developer ID". codesign alone passed an unsigned DMG for
      # releases; this fails the run instead. (Both the exit status and the source
      # line must agree, so a runner with assessments overridden can't pass.)
      - name: Gatekeeper check
        if: env.HAS_NOTARY == 'true'
        run: |
          xcrun stapler validate "build/$APP.app"
          xcrun stapler validate "dist/$APP.dmg"
          assess() {  # <label> <spctl args…>
            local label="$1" out status=0; shift
            out="$(spctl --assess -v "$@" 2>&1)" || status=$?
            echo "$out"
            if [ "$status" -ne 0 ] || ! grep -q "source=Notarized Developer ID" <<<"$out"; then
              echo "::error::Gatekeeper does not accept $label as Notarized Developer ID."
              exit 1
            fi
          }
          assess "the app" --type execute "build/$APP.app"
          assess "the DMG" --type open --context context:primary-signature "dist/$APP.dmg"

      # A manual run publishes nothing, so keep what it built: the signed,
      # notarized, stapled DMG can then be checked (codesign / spctl / stapler)
      # before a tag commits to a release.
      - name: Keep dry-run DMG
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP }}-dry-run
          path: dist/${{ env.APP }}.dmg
          retention-days: 7

      # Only a tag push publishes; a manual run builds + notarizes as a dry-run.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ env.APP }}.dmg
          generate_release_notes: true

      # Keep the Homebrew tap in sync so `brew upgrade --cask <app>` gets new
      # versions. Needs a TAP_PUSH_TOKEN secret (a token with contents:write on
      # grokcodile/homebrew-tap); skipped if it isn't set.
      #
      # The cask's minimum macOS comes from the same place the build's does —
      # Info.plist's LSMinimumSystemVersion — so raising it there raises it here
      # on the next release, and never before: the cask keeps describing the
      # release it points at. Homebrew's own table names the version (26 →
      # :tahoe), so no list of macOS codenames lives in this file.
      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_TAP == 'true'
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "dist/$APP.dmg" | awk '{print $1}')
          MIN_MACOS=$(plutil -extract LSMinimumSystemVersion raw Info.plist)
          MACOS=$(brew ruby -e "puts MacOSVersion.new('${MIN_MACOS}').to_sym" 2>/dev/null || true)
          if ! printf '%s' "$MACOS" | grep -Eq '^[a-z_]+$'; then
            echo "::error::This runner's Homebrew has no name for macOS ${MIN_MACOS} (got '${MACOS}'), so the cask's depends_on can't be set."
            exit 1
          fi
          echo "version=${VERSION}  sha256=${SHA}  macos=:${MACOS} (${MIN_MACOS})"

          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/grokcodile/homebrew-tap.git" tap
          cd tap
          CASK_FILE="Casks/${CASK}.rb"
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" "$CASK_FILE"
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" "$CASK_FILE"
          sed -i '' -E "s/^  depends_on macos: .*/  depends_on macos: :${MACOS}/" "$CASK_FILE"
          # sed is silent when it matches nothing, so a renamed field or file
          # would leave the cask on the old values and the release would look
          # like a success. Read every one back instead of trusting it.
          check() {  # <what> <line pattern> <expected line>
            if ! grep -qxF "$3" "$CASK_FILE"; then
              echo "::error::$CASK_FILE has no '$3' after substitution — the cask's $1 was not updated."
              grep -nE "$2" "$CASK_FILE" || true
              exit 1
            fi
          }
          check version    '^  version '          "  version \"${VERSION}\""
          check sha256     '^  sha256 '           "  sha256 \"${SHA}\""
          check depends_on '^  depends_on macos'  "  depends_on macos: :${MACOS}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Already correct (a re-run, or the cask was bumped by hand first) is
          # success, not failure: `git commit` exits non-zero with nothing
          # staged, which used to fail the whole release after it had published.
          if git diff --quiet; then
            echo "Cask already at ${VERSION}; nothing to push."
            exit 0
          fi
          git commit -aqm "${CASK} ${VERSION}"
          # Both apps push to this one tap, so two releases close together can
          # race; the loser rebases onto the winner (different files, so it
          # always applies) and tries again.
          for attempt in 1 2 3; do
            git push -q && exit 0
            echo "Push rejected (attempt ${attempt}); rebasing onto the tap's latest."
            git pull -q --rebase
          done
          echo "::error::Could not push the cask update after 3 attempts."
          exit 1
